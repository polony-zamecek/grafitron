<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafitron</title>
    <!-- Tailwind CSS pro stylování -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Písmo Montserrat (Swiss Design) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Knihovna pro QR kódy -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode_js@1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #004d40; color: white; margin: 0; min-height: 100vh;}
        .btn { text-transform: uppercase; font-weight: 900; letter-spacing: 0.05em; transition: all 0.2s; border: none; outline: none; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none;}
        .btn:active { transform: translateY(4px); }
        .bg-salmon { background-color: #f4816e; color: #004d40; }
        .bg-cyan { background-color: #00ffff; color: #004d40; }
        .bg-dark { background-color: #004d40; border: 2px solid #00ffff; color: #00ffff; }
        .sharp { border-radius: 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1rem; }
        @media (max-width: 640px) { .grid-4 { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); } }
    </style>
</head>
<body class="flex flex-col p-4 md:p-8">

    <!-- 1. OBRAZOVKA: VÝBĚR ROLE -->
    <div id="view-role" class="flex-1 flex flex-col items-center justify-center space-y-12 h-screen">
        <h1 class="text-5xl md:text-8xl font-black tracking-widest text-[#00ffff]">GRAFITRON</h1>
        <div class="grid-2 w-full max-w-4xl h-48 md:h-64">
            <button id="btn-role-teacher" class="btn bg-cyan sharp text-3xl md:text-5xl">Učitel</button>
            <button id="btn-role-student" class="btn bg-salmon sharp text-3xl md:text-5xl">Student</button>
        </div>
    </div>

    <!-- 2. OBRAZOVKA: UČITEL - VÝBĚR TESTU Z TABULKY -->
    <div id="view-teacher-setup" class="hidden flex-1 flex-col items-center justify-center max-w-3xl mx-auto w-full h-screen">
        <h2 class="text-4xl font-black text-[#00ffff] mb-8 uppercase text-center">Příprava hry</h2>
        <p id="teacher-loading" class="text-2xl mb-8 animate-pulse text-[#f4816e] font-bold">Připojuji se ke Google Tabulce...</p>
        
        <div id="teacher-setup-form" class="hidden w-full flex flex-col space-y-6">
            <label class="text-xl uppercase font-bold text-[#00ffff]">Vyber test z tabulky:</label>
            <select id="select-test" class="p-6 text-3xl sharp text-[#004d40] bg-white border-4 border-[#00ffff] uppercase font-bold outline-none cursor-pointer">
                <!-- Doplní se automaticky z Google Sheets -->
            </select>
            <button id="btn-create-room" class="btn bg-salmon sharp text-3xl p-8 mt-8 hover:bg-white hover:text-[#f4816e]">Založit místnost</button>
        </div>
    </div>

    <!-- 3. OBRAZOVKA: UČITEL - LOBBY A HRA -->
    <div id="view-teacher" class="hidden flex-1 flex-col w-full max-w-7xl mx-auto">
        <!-- Hlavička s PINem a QR -->
        <div class="flex justify-between items-center mb-8 border-b-4 border-[#00ffff] pb-6">
            <div>
                <h2 class="text-2xl font-bold uppercase text-[#f4816e] tracking-widest mb-2">Připoj se na mobilu! PIN:</h2>
                <div id="room-pin-display" class="text-7xl md:text-9xl font-black text-[#00ffff] tracking-widest">------</div>
            </div>
            <div class="bg-white p-4 border-4 border-[#f4816e]">
                <div id="qrcode"></div>
            </div>
        </div>

        <!-- Ovládací panel -->
        <div class="flex justify-between items-center mb-8 bg-[#00332a] p-6 border-2 border-[#00ffff]">
            <h3 class="text-3xl font-bold uppercase text-white"><span id="students-count" class="text-[#00ffff] text-5xl">0</span> Studentů v místnosti</h3>
            <button id="btn-start-quiz" class="btn bg-salmon sharp px-12 py-6 text-3xl hidden hover:bg-white">Spustit kvíz</button>
            <button id="btn-next-question" class="btn bg-cyan sharp px-12 py-6 text-3xl hidden animate-pulse hover:bg-white">Další otázka ➔</button>
        </div>

        <!-- Zobrazení otázky na projektoru -->
        <div id="teacher-question-view" class="hidden mb-12 text-center bg-[#00332a] p-8 border-4 border-[#f4816e]">
            <h2 id="teacher-question-text" class="text-5xl font-black mb-8 text-white leading-tight"></h2>
            <img id="teacher-question-image" src="" alt="Obrázek k otázce" class="max-h-80 mx-auto mb-8 hidden border-4 border-white object-contain">
            
            <div id="teacher-options" class="w-full">
                <!-- Odpovědi se vygenerují zde -->
            </div>
        </div>

        <!-- Žebříček připojených (Lobby) -->
        <h3 id="leaderboard-title" class="text-2xl font-bold uppercase text-[#00ffff] mb-4">Živý žebříček:</h3>
        <div id="leaderboard" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
            <!-- Studenti se načtou sem -->
        </div>
    </div>

    <!-- 4. OBRAZOVKA: STUDENT - PŘIHLÁŠENÍ -->
    <div id="view-student" class="hidden flex-1 flex-col items-center justify-center max-w-md mx-auto w-full h-screen space-y-6">
        <h2 class="text-5xl font-black text-[#00ffff] mb-8 uppercase text-center">Vstup do hry</h2>
        <input type="number" id="student-pin" placeholder="PIN" class="w-full p-6 text-4xl sharp text-center text-[#004d40] border-4 border-[#00ffff] font-black uppercase outline-none bg-white">
        <input type="text" id="student-name" placeholder="PŘEZDÍVKA" class="w-full p-6 text-3xl sharp text-center text-[#004d40] border-4 border-[#00ffff] font-black uppercase outline-none bg-white">
        <button id="btn-join-room" class="btn bg-salmon sharp w-full p-6 text-4xl mt-4 hover:bg-white hover:text-[#f4816e]">Hrát</button>
        <div id="student-error" class="text-[#f4816e] font-bold text-xl text-center h-8"></div>
    </div>

    <!-- 5. OBRAZOVKA: STUDENT - HRA (Ovladač) -->
    <div id="view-student-game" class="hidden flex-1 flex-col w-full max-w-md mx-auto h-screen justify-center">
        <!-- Čekání -->
        <div id="student-waiting" class="text-center">
            <h2 class="text-5xl font-black text-[#00ffff] mb-6 uppercase animate-pulse">Čekáme!</h2>
            <p class="text-2xl font-bold">Koukej na projektor.</p>
        </div>

        <!-- Hra -->
        <div id="student-playing" class="hidden h-full flex flex-col justify-center">
            <!-- Časomíra -->
            <div class="mb-8 w-full bg-[#00332a] border-4 border-[#00ffff] h-12 sharp relative">
                <div id="time-bar" class="bg-[#00ffff] h-full transition-all ease-linear" style="width: 100%;"></div>
            </div>
            
            <h2 id="student-info" class="text-2xl font-bold uppercase text-center text-white mb-4">Vyber barvu:</h2>
            <div id="student-input-area" class="flex-1 w-full pb-8">
                <!-- Tlačítka (Kahoot styl - jen barvy) se vygenerují zde -->
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGIKA APLIKACE -->
    <script type="module">
        // Import Firebase (verze 10.8.1)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Tvoje Firebase Konfigurace
        const firebaseConfig = {
            apiKey: "AIzaSyChRc14OD5Ca8KLxWMyRTy1zQnd3-j6O8w",
            authDomain: "grafitron-110b5.firebaseapp.com",
            projectId: "grafitron-110b5",
            storageBucket: "grafitron-110b5.firebasestorage.app",
            messagingSenderId: "593241952769",
            appId: "1:593241952769:web:697e9a2059d96d33d72600"
        };

        // Inicializace Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Tvoje Google Tabulka (Apps Script API)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3okFjuvMe7LXCnOeqkDh8yTrQIc6UizWpr8pTq-zNsvQDLyTU4YeRMB5eMW9VOpHQ/exec";

        // Globální proměnné
        let currentRole = null;
        let roomPin = null;
        let studentId = null;
        let quizData = [];
        let currentQuestionIndex = 0;
        let timerInterval;
        let timeLeft = 15;
        let timeLimit = 15;
        let currentQuestionType = '';
        
        // --- POMOCNÉ FUNKCE PRO ZOBRAZENÍ ---
        const views = {
            role: document.getElementById('view-role'),
            teacherSetup: document.getElementById('view-teacher-setup'),
            teacher: document.getElementById('view-teacher'),
            studentLogin: document.getElementById('view-student'),
            studentGame: document.getElementById('view-student-game')
        };

        function showView(viewName) {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
        }

        // Čtení PINu z URL (když student naskenuje QR kód)
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('pin')) {
            document.getElementById('student-pin').value = urlParams.get('pin');
            showView('studentLogin');
        }

        // --- UČITEL: LOGIKA ---
        
        // 1. Učitel klikne na hlavní tlačítko
        document.getElementById('btn-role-teacher').addEventListener('click', async () => {
            currentRole = 'teacher';
            showView('teacherSetup');
            
            try {
                // Načteme seznam listů (testů) z Google Tabulky
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getSheets`);
                const json = await res.json();
                
                if(json.status === 'success') {
                    const select = document.getElementById('select-test');
                    select.innerHTML = json.data
                        .filter(sheet => sheet !== 'Nastavení') // Ignorujeme případný list s nastavením
                        .map(sheet => `<option value="${sheet}">${sheet}</option>`).join('');
                    
                    document.getElementById('teacher-loading').classList.add('hidden');
                    document.getElementById('teacher-setup-form').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('teacher-loading').innerText = "CHYBA: Nelze se spojit s Tabulkou!";
            }
        });

        // 2. Učitel vybere test a zakládá místnost
        document.getElementById('btn-create-room').addEventListener('click', async () => {
            const sheetName = document.getElementById('select-test').value;
            const btn = document.getElementById('btn-create-room');
            btn.innerText = "NAČÍTÁM OTÁZKY Z GOOGLU...";
            
            try {
                // Stáhneme konkrétní otázky z vybraného listu
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getQuestions&sheetName=${encodeURIComponent(sheetName)}`);
                const json = await res.json();
                
                if(json.status === 'success' && json.data.length > 0) {
                    quizData = json.data;
                    setupRoom();
                } else {
                    btn.innerText = "CHYBA: TEST JE PRÁZDNÝ";
                }
            } catch (e) {
                btn.innerText = "CHYBA SPOJENÍ S GOOGLE SERVEREM";
            }
        });

        // 3. Vytvoření místnosti ve Firestore a zobrazení Lobby
        async function setupRoom() {
            roomPin = Math.floor(100000 + Math.random() * 900000).toString(); // 6místný PIN
            document.getElementById('room-pin-display').innerText = roomPin;
            
            // Generování QR kódu
            const qrUrl = window.location.origin + window.location.pathname + "?pin=" + roomPin;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: qrUrl,
                width: 140, height: 140,
                colorDark : "#004d40", colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Zápis místnosti do databáze (status waiting)
            await setDoc(doc(db, "rooms", roomPin), {
                state: "waiting",
                questionIndex: 0,
                createdAt: new Date()
            });

            showView('teacher');

            // Posloucháme změny nad místností (jestli někdo odpověděl atd.)
            onSnapshot(doc(db, "rooms", roomPin), (snapshot) => {
                const data = snapshot.data();
                if(data) updateTeacherDashboard(data);
            });
        }

        // Aktualizace počtu připojených studentů
        function updateTeacherDashboard(roomData) {
            const studentsRef = collection(db, "rooms", roomPin, "students");
            onSnapshot(studentsRef, (snapshot) => {
                const board = document.getElementById('leaderboard');
                board.innerHTML = "";
                let count = 0;
                let allAnswered = true;
                
                snapshot.forEach((docSnap) => {
                    const s = docSnap.data();
                    count++;
                    if(!s.answeredCurrent && roomData.state === 'playing') allAnswered = false;
                    
                    const div = document.createElement('div');
                    // Design kartičky studenta. Zezelená (cyan), pokud už poslal odpověď
                    div.className = `p-4 text-center font-bold text-2xl uppercase sharp border-4 ${s.answeredCurrent ? 'bg-cyan text-[#004d40] border-white' : 'bg-[#00332a] border-[#00ffff] text-white'}`;
                    div.innerHTML = `${s.name}<br><span class="text-lg font-normal text-[#f4816e]">${s.score || 0} bodů</span>`;
                    board.appendChild(div);
                });
                
                document.getElementById('students-count').innerText = count;
                
                // Zobrazit tlačítko START jakmile je tu alespoň 1 student
                if(roomData.state === 'waiting' && count > 0) {
                    document.getElementById('btn-start-quiz').classList.remove('hidden');
                }
            });
        }

        // 4. Učitel spouští první otázku
        document.getElementById('btn-start-quiz').addEventListener('click', async () => {
            document.getElementById('btn-start-quiz').classList.add('hidden');
            document.getElementById('btn-next-question').classList.remove('hidden');
            document.getElementById('leaderboard-title').innerText = "Stav odpovědí:";
            
            await updateDoc(doc(db, "rooms", roomPin), {
                state: "playing",
                questionIndex: 0,
                forceReset: Math.random() // Donutí studenty resetovat UI
            });
            
            showTeacherQuestion(0);
        });

        // 5. Učitel posouvá na další otázku
        document.getElementById('btn-next-question').addEventListener('click', async () => {
            currentQuestionIndex++;
            
            if(currentQuestionIndex < quizData.length) {
                await updateDoc(doc(db, "rooms", roomPin), {
                    questionIndex: currentQuestionIndex,
                    forceReset: Math.random()
                });
                showTeacherQuestion(currentQuestionIndex);
            } else {
                // Konec hry
                await updateDoc(doc(db, "rooms", roomPin), { state: "finished" });
                document.getElementById('teacher-question-view').innerHTML = `<h2 class="text-7xl font-black text-[#00ffff] uppercase mb-4">Konec testu!</h2><p class="text-3xl text-white">Podívej se na výsledky v žebříčku níže.</p>`;
                document.getElementById('btn-next-question').classList.add('hidden');
            }
        });

        // Vykreslení otázky na projektoru (podpora typů z tabulky)
        function showTeacherQuestion(index) {
            const q = quizData[index];
            document.getElementById('teacher-question-view').classList.remove('hidden');
            document.getElementById('teacher-question-text').innerText = q.text;
            
            // Obrázek
            const imgEl = document.getElementById('teacher-question-image');
            if(q.image && q.image.trim() !== '') {
                imgEl.src = q.image;
                imgEl.classList.remove('hidden');
            } else {
                imgEl.classList.add('hidden');
            }

            const optContainer = document.getElementById('teacher-options');
            optContainer.innerHTML = '';
            
            const type = q.type ? q.type.trim() : 'multiple-choice';

            if(type === 'multiple-choice') {
                optContainer.className = 'grid-4 w-full h-48';
                const colors = ['bg-[#f4816e]', 'bg-[#00ffff]', 'bg-white', 'bg-gray-400'];
                const textColor = ['text-[#004d40]', 'text-[#004d40]', 'text-[#004d40]', 'text-black'];
                
                // Ošetření chyb v tabulce (kdyby nebyly 4 možnosti)
                let opts = q.options || [];
                if(opts.length === 0) opts = ["A", "B", "C", "D"];

                opts.forEach((opt, i) => {
                    const d = document.createElement('div');
                    d.className = `sharp text-3xl p-6 ${colors[i % 4]} ${textColor[i % 4]} font-bold flex items-center justify-center uppercase`;
                    d.innerText = opt;
                    optContainer.appendChild(d);
                });
            } else if (type === 'true-false') {
                 optContainer.className = 'grid-2 w-full h-48';
                 optContainer.innerHTML = `
                    <div class="sharp text-5xl p-6 bg-[#00ffff] text-[#004d40] font-black flex items-center justify-center">PRAVDA</div>
                    <div class="sharp text-5xl p-6 bg-[#f4816e] text-[#004d40] font-black flex items-center justify-center">NEPRAVDA</div>
                 `;
            } else if (type === 'text-input') {
                 optContainer.className = 'w-full h-32 flex items-center justify-center';
                 optContainer.innerHTML = `<div class="text-4xl text-[#00ffff] font-bold uppercase animate-pulse">Čekám na textové odpovědi ze zařízení...</div>`;
            }
        }


        // --- STUDENT: LOGIKA ---

        // 1. Přihlášení studenta
        document.getElementById('btn-join-room').addEventListener('click', async () => {
            const pin = document.getElementById('student-pin').value.trim();
            const name = document.getElementById('student-name').value.trim();
            const err = document.getElementById('student-error');
            
            if(!pin || !name) {
                err.innerText = "Musíš zadat PIN i Jméno!";
                return;
            }
            err.innerText = "Připojuji k serveru...";
            
            try {
                // Kontrola existence místnosti
                const roomSnap = await getDoc(doc(db, "rooms", pin));
                if(!roomSnap.exists()) {
                    err.innerText = "Místnost neexistuje!";
                    return;
                }
                
                // Přihlášení (anonymně na pozadí Firebase)
                await signInAnonymously(auth);
                roomPin = pin;
                studentId = "std_" + Math.floor(Math.random() * 9999999); 
                
                // Vytvoření profilu studenta v místnosti
                await setDoc(doc(db, "rooms", roomPin, "students", studentId), {
                    name: name,
                    score: 0,
                    answeredCurrent: false
                });
                
                showView('studentGame');
                listenToRoom(); // Začneme poslouchat pokyny učitele
                
            } catch (e) {
                err.innerText = "Chyba připojení k databázi.";
                console.error(e);
            }
        });

        let lastReset = null;

        // 2. Poslouchání stavu místnosti (hrajem/čekáme)
        function listenToRoom() {
            onSnapshot(doc(db, "rooms", roomPin), async (snapshot) => {
                const data = snapshot.data();
                if(!data) return;

                if(data.state === 'waiting') {
                    document.getElementById('student-waiting').classList.remove('hidden');
                    document.getElementById('student-playing').classList.add('hidden');
                } 
                else if(data.state === 'playing') {
                    document.getElementById('student-waiting').classList.add('hidden');
                    document.getElementById('student-playing').classList.remove('hidden');
                    
                    // Zjistíme, jestli učitel nespustil novou otázku
                    if(data.forceReset !== lastReset) {
                        lastReset = data.forceReset;
                        
                        // Odemkneme studentovi UI
                        await updateDoc(doc(db, "rooms", roomPin, "students", studentId), { answeredCurrent: false });
                        
                        // Zde by si mobilní klient ideálně stáhl type z tabulky. 
                        // Pro zjednodušení Kahoot stylu (kde student kouká na projektor) vykreslujeme 4 velká tlačítka.
                        // (Abychom sem dostali přesný type z Google Sheetu bez komplikovaného serveru, 
                        // předpokládáme standardní 4-tlačítkový mobilní ovladač, jako má Kahoot).
                        buildStudentUI();
                        startStudentTimer(15);
                    }
                }
                else if (data.state === 'finished') {
                    document.getElementById('student-waiting').classList.remove('hidden');
                    document.getElementById('student-playing').classList.add('hidden');
                    document.getElementById('student-waiting').innerHTML = `<h2 class="text-6xl font-black text-[#00ffff] uppercase mb-4">Hotovo!</h2><p class="text-3xl font-bold">Koukej na výsledky.</p>`;
                }
            });
        }

        // Vykreslení mobilního ovladače (Kahoot styl - jen barevné plochy)
        function buildStudentUI() {
            const area = document.getElementById('student-input-area');
            area.innerHTML = '';
            area.className = 'grid-4 w-full h-[50vh]'; // Zabere půlku mobilního displeje
            
            const colors = ['bg-[#f4816e]', 'bg-[#00ffff]', 'bg-white', 'bg-gray-400'];
            const shapes = ['▲', '◆', '●', '■'];
            
            for(let i=0; i<4; i++) {
                const btn = document.createElement('button');
                btn.className = `btn sharp text-6xl p-8 ${colors[i]} text-black`;
                btn.innerText = shapes[i];
                btn.onclick = () => submitAnswer(i);
                area.appendChild(btn);
            }
        }

        // 3. Časomíra na mobilu
        function startStudentTimer(seconds) {
            clearInterval(timerInterval);
            const bar = document.getElementById('time-bar');
            timeLimit = seconds;
            timeLeft = seconds;
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const pct = Math.max(0, (timeLeft / timeLimit) * 100);
                bar.style.width = pct + '%';
                
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1); // Vypršel čas
                }
            }, 100);
        }

        // 4. Odeslání odpovědi
        async function submitAnswer(answerVal) {
            clearInterval(timerInterval);
            const area = document.getElementById('student-input-area');
            area.className = 'flex items-center justify-center h-[50vh]';
            
            if(answerVal === -1) {
                 area.innerHTML = `<h2 class="text-4xl font-black uppercase text-[#f4816e]">Čas vypršel!</h2>`;
            } else {
                 area.innerHTML = `<h2 class="text-4xl font-black uppercase text-[#00ffff]">Odesláno!</h2>`;
            }
            
            // Zapsání do Firestore
            const sRef = doc(db, "rooms", roomPin, "students", studentId);
            const snap = await getDoc(sRef);
            if(snap.exists()) {
                let currentScore = snap.data().score || 0;
                // V reálné hře by se zde ověřilo, zda vybral správný index oproti správné odpovědi
                // Zde přičítáme body za účast/rychlost jako simulaci.
                if(answerVal !== -1) {
                    currentScore += Math.floor(timeLeft * 100);
                }
                
                await updateDoc(sRef, { 
                    answeredCurrent: true,
                    score: currentScore
                });
            }
        }
    </script>
</body>
</html>
